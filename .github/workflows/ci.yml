name: CI

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Infrastructure guard regressions
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install project and test dependencies
        run: python -m pip install -U pip pytest && python -m pip install -e .
      - name: Environment diagnostics
        run: python scripts/ci_diagnostics.py
      - name: Run tests
        run: python -m pytest
